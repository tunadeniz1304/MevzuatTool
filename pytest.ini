[pytest]
pythonpath = src
testpaths = tests
# Tür-izolasyonu (ADR-0014) gereği her tür kendi test_fetch.py'sine sahip
# (tests/kanun/test_fetch.py, tests/teblig/test_fetch.py). Varsayılan "prepend" import modunda
# pytest aynı isimli modülleri ayırt edemez ("import file mismatch"); __init__.py eklemek de
# çözmez — 'tests.kanun' paketi 'src/kanun' ile isim çakışır (ModuleNotFoundError: kanun.tree).
# importlib modu her test dosyasını kendi yolundan yükler → çakışma yok, __init__.py gerekmez.
# -m "not model": gerçek model dosyası gerektiren testler varsayılanda atlanır (ADR-0016);
# çalıştırmak için: pytest -q -m model
addopts = --import-mode=importlib -m "not model"
markers =
    model: gerçek model dosyası gerektirir (ONNX/HF ağırlıkları) — varsayılan pytest'te atlanır
